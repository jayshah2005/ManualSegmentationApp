[project]
name = "hsi-leaf-curation"
version = "0.1.0"
description = "HSI leaf curation API (FastAPI + SAM2 + OCR)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "spectral>=0.23",
    "scikit-image>=0.22",
    "easyocr>=1.7",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "SAM-2",
]

[tool.uv]
package = false

# Match the CUDA build previously used in my_env (torch 2.x + cu130).
# On machines without a GPU driver, these wheels still run on CPU.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
SAM-2 = { path = "../sam2", editable = true }
