[project]
name = "segmentation-tool"
version = "0.2.0"
description = "Point-and-click image segmentation (SAM 2) for RGB, multispectral and hyperspectral images"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "spectral>=0.23",
    "tifffile>=2024.1.0",
    "scipy>=1.11",
    "h5py>=3.10",
    "platformdirs>=4.0",
]
# PyTorch and SAM 2 are NOT listed here on purpose: the right PyTorch build depends on
# the user's GPU/driver, so the app installs them from its setup screen (see
# backend/engine.py). The backend starts fine without them.

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
